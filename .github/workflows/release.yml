name: Release to npm
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Signed release tag to publish
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  package:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      package_file: ${{ steps.release.outputs.package_file }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check release identity
        id: release
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
      - run: npm ci
      - run: npm run check
      - name: Pack the checked build
        run: |
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: release-artifact/${{ steps.release.outputs.package_file }}
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish checked package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-artifact
      - name: Publish to npm
        run: npm publish "./release-artifact/$PACKAGE_FILE" --access public --ignore-scripts --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ needs.package.outputs.package_file }}
          NPM_TAG: ${{ needs.package.outputs.npm_tag }}
